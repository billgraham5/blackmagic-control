<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Camera control</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%234c8dff'/></svg>">
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <div>
      <h1 id="camera-name">Camera control</h1>
      <div class="sub" id="status-line">connecting&hellip;</div>
    </div>
    <span class="spacer"></span>
    <button class="rec hidden" id="record">REC</button>
  </header>

  <nav class="tabs">
    <button data-tab="control" class="on">Control</button>
    <button data-tab="status">Status</button>
    <button data-tab="configure">Configure</button>
  </nav>

  <div class="banner" id="banner"></div>

  <main id="tab-control">
    <section class="card hidden" id="card-exposure">
      <h2>Exposure</h2>

      <div class="row" id="row-iso">
        <span class="label">ISO</span>
        <span class="value" id="iso-value">&mdash;</span>
        <button data-deck="/deck/iso/down" title="One stop down">&minus;</button>
        <button data-deck="/deck/iso/up" title="One stop up">+</button>
        <span class="chips" id="iso-chips"></span>
      </div>

      <div class="row" id="row-shutter">
        <span class="label">Shutter</span>
        <span class="value" id="shutter-value">&mdash;</span>
        <button data-deck="/deck/shutter/down">&minus;</button>
        <button data-deck="/deck/shutter/up">+</button>
        <span class="chips">
          <button data-deck="/deck/shutter/50" data-shutter="50">1/50</button>
          <button data-deck="/deck/shutter/60" data-shutter="60">1/60</button>
          <button data-deck="/deck/shutter/100" data-shutter="100">1/100</button>
          <button data-deck="/deck/shutter/125" data-shutter="125">1/125</button>
          <button data-deck="/deck/shutter/angle/18000">180&deg;</button>
        </span>
      </div>

      <div class="row" id="row-wb">
        <span class="label">White bal.</span>
        <span class="numfield"><input type="number" id="wb-input" min="2500" max="10000" step="10" inputmode="decimal" autocomplete="off" aria-label="White balance in kelvin"><span class="affix">K</span></span>
        <input type="range" id="wb-slider" min="2500" max="10000" step="50" data-control="wb">
      </div>
      <div class="row" id="row-wb-presets">
        <span class="label"></span>
        <span class="chips" id="wb-chips"></span>
        <button data-deck="/deck/wb/auto">Auto WB</button>
      </div>

      <div class="row" id="row-tint">
        <span class="label">Tint</span>
        <span class="numfield"><input type="number" id="tint-input" min="-50" max="50" step="1" inputmode="decimal" autocomplete="off" aria-label="White balance tint"></span>
        <input type="range" id="tint-slider" min="-50" max="50" step="1" data-control="tint">
      </div>

      <div class="row" id="row-ae">
        <span class="label">Auto exp.</span>
        <button id="ae-toggle" class="wide">Auto exposure</button>
      </div>
    </section>

    <section class="card hidden" id="card-lens">
      <h2>Lens <span style="text-transform:none;font-weight:400"> &mdash; active MFT only</span></h2>

      <div class="row" id="row-iris">
        <span class="label">Iris</span>
        <span class="numfield">
          <span class="affix">f/</span>
          <input type="number" id="iris-fstop" step="0.1" min="1" max="22"
                 inputmode="decimal" autocomplete="off" aria-label="Aperture, f-number">
        </span>
        <span class="chips" id="iris-chips"></span>
        <span class="hint" id="iris-range"></span>
      </div>

      <div class="row" id="row-focus">
        <span class="label">Focus</span>
        <span class="numfield"><input type="number" id="focus-input" min="0" max="100" step="0.5" inputmode="decimal" autocomplete="off" aria-label="Focus position, percent"><span class="affix">%</span></span>
        <input type="range" id="focus-slider" min="0" max="1" step="0.005" data-control="focus">
        <button data-deck="/deck/focus/auto">AF</button>
      </div>

      <div class="row" id="row-zoom">
        <span class="label">Zoom</span>
        <span class="numfield"><input type="number" id="zoom-input" min="0" max="100" step="1" inputmode="decimal" autocomplete="off" aria-label="Zoom position, percent"><span class="affix">%</span></span>
        <input type="range" id="zoom-slider" min="0" max="1" step="0.01" data-control="zoom">
        <span class="hint" id="zoom-focal"></span>
      </div>
    </section>

    <section class="card hidden" id="card-color">
      <h2>Colour</h2>
      <div class="row" id="row-saturation">
        <span class="label">Saturation</span>
        <span class="numfield"><input type="number" id="saturation-input" min="0" max="2" step="0.01" inputmode="decimal" autocomplete="off" aria-label="Saturation"></span>
        <input type="range" id="saturation-slider" min="0" max="2" step="0.01" data-control="saturation">
      </div>
    </section>

    <section class="card hidden" id="card-monitoring">
      <h2>Monitoring</h2>
      <div class="row hidden" id="row-display">
        <span class="label">Output</span>
        <span class="chips" id="display-chips"></span>
      </div>
      <div class="row">
        <span class="label">Overlays</span>
        <span class="chips" id="monitor-toggles"></span>
      </div>
      <div class="row hidden" id="row-tally">
        <span class="label">Tally</span>
        <span class="value" id="tally-value">&mdash;</span>
      </div>
    </section>

    <section class="card hidden" id="card-presets">
      <h2>Presets</h2>
      <div class="chips" id="preset-chips"></div>
    </section>

    <section class="card hidden" id="card-media">
      <h2>Media</h2>
      <div class="row">
        <span class="label">Remaining</span>
        <span class="value" id="media-remaining">&mdash;</span>
        <span class="sub" id="media-volume"></span>
      </div>
    </section>
  </main>

  <main id="tab-status" class="hidden">
    <div class="row">
      <input type="search" id="status-filter" class="filter" placeholder="Filter&hellip;"
             autocomplete="off" aria-label="Filter status entries">
      <span class="hint" id="status-count"></span>
    </div>
    <div id="status-groups"></div>
  </main>

  <main id="tab-configure" class="hidden">
    <div class="row">
      <input type="search" id="config-filter" class="filter" placeholder="Filter&hellip;"
             autocomplete="off" aria-label="Filter settings">
      <span class="hint" id="config-count"></span>
    </div>
    <div id="config-groups"></div>
  </main>

  <footer>
    <p>
      <span id="capability-note"></span>
      <a id="media-manager" href="#" target="_blank" rel="noopener">Web media manager</a>
    </p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
