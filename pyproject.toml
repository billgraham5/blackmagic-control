[project]
name = "bmc"
version = "0.1.0"
description = "Local control service for Blackmagic cameras with the Camera Control REST API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bmc = "bmc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bmc*"]

[tool.setuptools.package-data]
bmc = ["web/*"]
